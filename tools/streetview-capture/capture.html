<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Chụp Street View — Dải trung tâm Hải Phòng</title>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, Arial, sans-serif; background: #111; }
  #pano { position: fixed; inset: 0; }
  #panel {
    position: fixed; top: 12px; left: 12px; z-index: 10; width: 320px; max-height: 94vh; overflow: auto;
    background: rgba(20,24,28,.94); color: #eef; border-radius: 12px; padding: 14px 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,.5); font-size: 13px; line-height: 1.5;
  }
  #panel h1 { font-size: 15px; margin: 0 0 8px; }
  #panel label { display: block; margin: 8px 0 2px; color: #9fb3c8; }
  #panel input { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 7px; border: 1px solid #3a4653; background: #0e1418; color: #eef; }
  #panel .row { display: flex; gap: 8px; }
  #panel .row > div { flex: 1; }
  button { margin-top: 10px; width: 100%; padding: 9px; border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; }
  #start { background: #2e9c56; color: #fff; }
  #stop { background: #b5423a; color: #fff; }
  #log { margin-top: 10px; font-family: ui-monospace, monospace; font-size: 11px; white-space: pre-wrap; max-height: 34vh; overflow: auto; background: #0b0f13; padding: 8px; border-radius: 7px; color: #bfe; }
  .muted { color: #7f93a8; }
  a { color: #7cc; }
</style>
</head>
<body>
<div id="pano"></div>
<div id="panel">
  <h1>🌺 Chụp Street View — Dải trung tâm HP</h1>
  <div class="muted" id="wpcount">…</div>
  <label>Google Maps API key <span class="muted">(bật Maps JavaScript API)</span></label>
  <input id="key" type="password" placeholder="AIza…" autocomplete="off">
  <div class="row">
    <div>
      <label>Số góc / vòng</label>
      <input id="nheading" type="number" min="4" max="24" value="8">
    </div>
    <div>
      <label>Pitch (°, cách nhau ,)</label>
      <input id="pitches" value="0">
    </div>
  </div>
  <div class="row">
    <div>
      <label>Chờ tải tile (ms)</label>
      <input id="tilewait" type="number" min="400" value="1300">
    </div>
    <div>
      <label>Nghỉ giữa ảnh (ms)</label>
      <input id="gap" type="number" min="200" value="550">
    </div>
  </div>
  <label>Bán kính tìm pano (m)</label>
  <input id="radius" type="number" min="10" value="70">
  <button id="start">▶ Bắt đầu chụp</button>
  <button id="stop" style="display:none">■ Dừng</button>
  <div id="log"></div>
  <div class="muted" style="margin-top:8px">Ảnh lưu vào <b>Downloads/hp-streetview/</b> kèm <b>manifest.json</b>.</div>
</div>
<script src="capture.js" type="module"></script>
</body>
</html>
