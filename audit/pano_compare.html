const HS=['000','090','180','270'];const HN={'000':'Bắc 0°','090':'Đông 90°','180':'Nam 180°','270':'Tây 270°'};
function cls(s){return s==null?'s-na':s>=5?'s-hi':s>=3?'s-mid':'s-lo'}
function render(){
 const mode=document.getElementById('sort').value;
 const rows=[...ROWS].sort((a,b)=>mode==='id'?a.id.localeCompare(b.id):mode==='scoredesc'?(b.score??-1)-(a.score??-1):(a.score??99)-(b.score??99));
 const ok=ROWS.filter(r=>r.score!=null);
 document.getElementById('stat').textContent='TB: '+(ok.reduce((s,r)=>s+r.score,0)/ok.length).toFixed(2)+'/10 ('+ok.length+' pano có điểm)';
 document.getElementById('list').innerHTML=rows.map(r=>`
 <div class="pano"><div class="meta"><span class="pid">${r.id}</span>
 <span class="score ${cls(r.score)}">${r.score==null?'chưa chấm':r.score+'/10'}</span>
 <span class="area">(x=${r.X}, z=${r.Z}) — ${r.area}</span></div>
 <div class="grid">${HS.map(h=>`<div class="pair"><div class="hd">${HN[h]} ${r.hscores&&r.hscores[parseInt(h)]!=null?'· '+r.hscores[parseInt(h)]+'đ':''}</div>
 <div class="cell real"><img loading="lazy" src="pano_compare/img/real_${r.id}_${h}.jpg" onerror="this.style.opacity=.15"><span class="lbl">THẬT</span></div>
 <div class="cell"><img loading="lazy" src="pano_compare/img/game_${r.id}_${h}.jpg" onerror="this.style.opacity=.15"><span class="lbl" style="background:#1d6b3aa8">GAME</span></div>
 </div>`).join('')}</div></div>`).join('');
}
document.getElementById('sort').onchange=render;render();
