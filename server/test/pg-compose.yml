# Throw-away Postgres 17 for `npm run test:pg` (server/test/pg_run.mjs starts and removes it).
# Port / project name / password come from the environment (each agent or developer uses their own).
services:
  pg:
    image: postgres:17
    environment:
      POSTGRES_USER: hp
      POSTGRES_DB: hp_test
      POSTGRES_PASSWORD: ${PG_TEST_PASSWORD:?set by pg_run.mjs}
    ports:
      - "127.0.0.1:${PG_TEST_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hp -d hp_test"]
      interval: 1s
      timeout: 3s
      retries: 60
