# server/ops/cloudflared/config.yml — S5. Ingress của Cloudflare NAMED tunnel (tunnel quản lý cục bộ, chạy bằng token).
# Được CHÉP vào ảnh hpworld-tunnel lúc build (server/ops/cloudflared/Dockerfile) — không bind mount.
# Chỉ 4 đường đi tới cổng game; mọi thứ khác (kể cả /admin) trả 404 ngay tại cloudflared. Không có tên máy (hostname)
# nào ở đây: tên miền của anh được gắn bằng `cloudflared tunnel route dns` (xem docs/multiplayer/VAN_HANH.md).
# LƯU Ý: nếu tạo tunnel trên trang web Cloudflare (tunnel "remotely-managed") thì Cloudflare dùng luật trên web thay
# cho file này — khi đó phải nhập đúng 4 luật dưới đây trên web. Cách khuyên dùng là tạo bằng dòng lệnh (VAN_HANH.md §7).
no-autoupdate: true
ingress:
  - path: ^/(play|probe|healthz)$
    service: http://game:9100
  - path: ^/v1/
    service: http://game:9100
  - service: http_status:404
