name: Deploy to GitHub Pages

# Mirror nhánh chính sang gh-pages — GitHub Pages phục vụ từ nhánh gh-pages
on:
  push:
    branches: [claude/3d-haiphong-interactive-world-pli2l6]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to gh-pages
        # Bỏ thư mục server/ (máy chủ multiplayer chạy riêng, không phục vụ qua Pages) khỏi bản mirror: dựng một commit
        # có cây thư mục y hệt HEAD trừ server/, rồi đẩy commit đó lên gh-pages. Mọi thứ khác giữ nguyên.
        # version.json (chỉ có trên bản Pages, không commit vào nhánh): mã commit nguồn — màn tiêu đề hiện "bản xxxxxxx",
        # server/ops/mo-may-chu.ps1 + trang-thai.ps1 so nó với mã trên máy chủ (vòng sửa 1 MP-2b, DEPLOY-VERSION-GAP).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-tree -d --name-only HEAD server | grep -qx server; then
            git rm -r -q --cached server
          fi
          printf '{"sha":"%s","date":"%s"}' "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          git add -f version.json
          TREE=$(git write-tree)
          PAGES=$(git commit-tree "$TREE" -p HEAD -m "Pages mirror of ${GITHUB_SHA} (không có server/)")
          git push -f origin "$PAGES:refs/heads/gh-pages"
